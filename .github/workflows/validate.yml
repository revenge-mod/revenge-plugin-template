# PR build validation

name: Validate

on:
  # WARNING: Since you generated this template, likely not in an organization that hosts the Revenge API package, you'll need your PAT to fetch the Revenge API dependency.
  # Set it in your repository secrets as READ_PACKAGES_TOKEN, make sure it can ONLY read packages, as malicious actors could reveal your token if you approve to run actions from a PR.
  pull_request_target:
    paths:
      - 'plugins/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR security acknowledgment
        run: |
          if [ "${{ vars.ACKNOWLEDGE_PR_SECURITY_WARNING }}" != "true" ]; then
            echo "::error::You have not acknowledged the security warning for this workflow."
            echo "This workflow uses 'pull_request_target' and requires your explicit acknowledgment to prevent potential secret leaks."
            echo "Please configure pull requests to require maintainer approval by going to Settings > Actions > General, and set Require approval for all external contributors."
            echo "Then configure this variable under repository Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }} # For Gradle to download the API dependency. Read the warning above about this token.

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://revenge.local \
            --out /tmp/index.json
          cat /tmp/index.json
